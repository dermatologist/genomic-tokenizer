[project]
name = "genomic-tokenizer"
version = "0.1.0"
description = "Genomic Tokenizer"
authors = [{ name = "Bell Eapen", email = "github_public@gulfdoctor.net" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.0.0,<5.0.0",
    "pytest>=8.2.0,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
